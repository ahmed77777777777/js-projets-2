<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getGrade(degree) {
    if (degree < 0 || degree > 100) return "Invalid degree";
    if (degree >= 90) return "A";
    if (degree >= 80) return "B";
    if (degree >= 70) return "C";
    if (degree >= 50) return "D";
    return "F";
}

let degree =prompt("Enter your degree:");

document.write(getGrade(degree));


    </script>
</body>
</html>

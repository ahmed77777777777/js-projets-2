<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function countDigits(num) {
    let count = 0;

    while (num > 0) {
        num = (num - num % 10) / 10;
        count++;
    }

    return count;
}

let num = prompt("Enter a positive number:");

document.write(countDigits(num));
    </script>
</body>
</html>
